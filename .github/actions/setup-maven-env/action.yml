name: Setup Maven Environment
description: Configures JDK, dependency caching, GH Packages read auth, versioning, and optionally publish auth.
author: Digdir Platform Team

inputs:
  java-version:
    default: "25"
  java-distribution:
    default: "liberica"
  cache-path:
    default: "**/pom.xml"
  application-path:
    default: "./"
  read-user:
    required: true
  read-pat:
    required: true
  new-version:
    description: "If provided, runs mvn versions:set to update the pom.xml version"
    default: ""
  publish-actor:
    description: "If provided along with publish-token, overwrites settings.xml for deploy"
    default: ""
  publish-token:
    description: "Token for publishing artifacts"
    default: ""

runs:
  using: composite
  steps:
    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # pin@v5.7.0
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}
        cache: maven
        cache-dependency-path: ${{ inputs.cache-path }}
        server-id: github
        server-username: GH_PACKAGES_READ_USER
        server-password: GH_PACKAGES_READ_PAT
      env:
        GH_PACKAGES_READ_USER: ${{ inputs.read-user }}
        GH_PACKAGES_READ_PAT: ${{ inputs.read-pat }}

    - name: Update Maven version
      if: inputs.new-version != ''
      shell: bash
      env:
        APP_PATH: ${{ inputs.application-path }}
        NEW_VERSION: ${{ inputs.new-version }}
      run: |
        echo "### Maven versions" >> "$GITHUB_STEP_SUMMARY"
        mvn versions:set -B --file "${APP_PATH}pom.xml" -DnewVersion="$NEW_VERSION"
        echo "- \`mvn versions\` was executed (Set to $NEW_VERSION)" >> "$GITHUB_STEP_SUMMARY"

    - name: Overwrite m2 settings for publishing
      if: inputs.publish-actor != '' && inputs.publish-token != ''
      shell: bash
      env:
        PUBLISH_ACTOR: ${{ inputs.publish-actor }}
        PUBLISH_TOKEN: ${{ inputs.publish-token }}
      run: |
        mkdir -p ~/.m2
        echo
        "<settings><servers><server><id>github</id><username>${PUBLISH_ACTOR}</username><password>${PUBLISH_TOKEN}</password></server></servers></settings>"
        > ~/.m2/settings.xml
