name: Setup Maven Environment
description: Configures JDK, dependency caching and GH Packages auth.
author: Digdir Platform Team

inputs:
  java-version:
    description: "Java version to set up"
    default: "25"
  java-distribution:
    description: "Java distribution to use"
    default: "liberica"
  cache-path:
    description: "Path to pom.xml for cache invalidation"
    default: "**/pom.xml"
  application-path:
    description: "Path to the application root"
    default: "./"
  server-username:
    description: "Username for the Maven server (defaults to GitHub Packages read access)"
    required: true
  server-password:
    description: "Password/PAT for the Maven server"
    required: true

runs:
  using: composite
  steps:
    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # pin@v6.0.0
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}
        cache: maven
        cache-dependency-path: ${{ inputs.cache-path }}
        server-id: github
        server-username-env-var: MAVEN_SERVER_USERNAME
        server-password-env-var: MAVEN_SERVER_PASSWORD

    - name: Set default Maven credentials
      shell: bash
      env:
        SERVER_USERNAME: ${{ inputs.server-username }}
        SERVER_PASSWORD: ${{ inputs.server-password }}
      run: |
        echo "MAVEN_SERVER_USERNAME=$SERVER_USERNAME" >> "$GITHUB_ENV"
        echo "MAVEN_SERVER_PASSWORD=$SERVER_PASSWORD" >> "$GITHUB_ENV"
